---
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: pool
spec:
  allowFirstLastIPs: "No"
  # Only the gateway VIPs, and only for the gateway Services: handing out
  # node_cidr addresses would let a new LoadBalancer Service claim (and
  # announce) the router, a node or a DHCP client's IP, and an open pool
  # would let it take a gateway VIP first. For your own LoadBalancer
  # Services, add a second pool with a free range and no serviceSelector;
  # existing ones lose their node_cidr address until it covers them.
  serviceSelector:
    matchExpressions:
      - { key: io.kubernetes.service.namespace, operator: In, values: ["network"] }
      - key: io.kubernetes.service.name
        operator: In
        values: ["envoy-external", "envoy-internal", "k8s-gateway"]
  blocks:
    - cidr: "192.168.99.40/32"
    - cidr: "192.168.99.10/32"
    - cidr: "192.168.99.50/32"
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: l2-policy
spec:
  loadBalancerIPs: true
  # NOTE: interfaces might need to be set if you have more than one active NIC on your hosts
  # interfaces:
  #   - ^bond[0-9]+
  #   - ^eno[0-9]+
  #   - ^eth[0-9]+
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
---
apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: bgp-advertisement-config
  labels:
    advertise: bgp
spec:
  advertisements:
    - advertisementType: Service
      service:
        addresses:
          - LoadBalancerIP
      selector:
        matchExpressions:
          - { key: somekey, operator: NotIn, values: ["never-used-value"] }
---
apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: bgp-peer-config-v4
spec:
  families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          advertise: bgp
---
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: bgp-cluster-config
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
  bgpInstances:
    - name: instance-64513
      localASN: 64513
      peers:
        - name: peer-64512-v4
          peerASN: 64512
          peerAddress: 192.168.99.1
          peerConfigRef:
            name: bgp-peer-config-v4
