---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: suwayomi
  namespace: downloads
spec:
  components:
    - ../../../../components/kopiur/backup
  #    - ../../../../components/zeroscaler
  dependsOn:
    - name: linstor
      namespace: flux-system
  targetNamespace: downloads
  commonMetadata:
    labels:
      app.kubernetes.io/name: suwayomi
  interval: 1h
  patches: []
  path: ./kubernetes/apps/downloads/suwayomi/app
  postBuild:
    substitute:
      APP: suwayomi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 3m
  wait: true
