---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: komf
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: komf
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: komga
  values:
    controllers:
      komf:
        pod:
          annotations:
            setGateway: "false"
            reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: sndxr/komf
              tag: 2.1.0@sha256:373580779e2e75d4e00e2f05859f789e05691c54600ca83d1cb528f0aad1f7b6
            env:
              KOMF_KOMGA_BASE_URI: http://komga.downloads.svc.cluster.local:8080
              KOMF_LOG_LEVEL: INFO
              JAVA_TOOL_OPTIONS: "-Xmx512m"
            envFrom:
              - secretRef:
                  name: komf-secret
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                cpu: 150m
                memory: 768Mi
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: komf
        ports:
          http:
            port: 8085
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Books
          gethomepage.dev/name: Komf
          gethomepage.dev/icon: komga.png
          gethomepage.dev/description: Komga Metadata Analyser
      #    external-dns.alpha.kubernetes.io/target: internal.${SECRET_DOMAIN}
        hostnames: ["{{ .Release.Name }}.musai.ovh"]
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        enabled: true
        existingClaim: ${APP_NAME}
        globalMounts:
          - path: /config
      configmap:
        enabled: true
        type: configMap
        name: komf-configmap
        globalMounts:
          - path: /config/application.yml
            # readOnly: true
            subPath: application.yml
      media:
        enabled: true
        existingClaim: nfs-manga
        globalMounts:
          - path: /data
            subPath: Literature
